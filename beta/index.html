<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202a3b">
<title>DuoPy β</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;--bg:#182332;--body:#34475f;--edge:#101b2c;--key:#e2e9f2;--ink:#172438;--accent:#99caff;--run:#a2edb1;--lh:clamp(12px,3.8dvh,18px);--font:clamp(10px,3.05dvh,15px)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{border:1px solid #8293aa;border-radius:6px;background:linear-gradient(#f1f5fa,#cdd9e8);color:var(--ink);font:650 clamp(11px,3.7dvh,19px)/1 system-ui,sans-serif;min-width:0;min-height:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 0 #0e1829;display:grid;place-items:center;padding:0 2px}
button:active,button.on{transform:translateY(1px);box-shadow:0 0 0 #0e1829;background:#9dc8f4}button:focus-visible{outline:2px solid #a2edb1;outline-offset:1px}button:disabled{opacity:.45;cursor:default}
.deck{height:100%;height:100dvh;max-height:100%;width:100%;display:grid;grid-template-columns:clamp(34px,6vw,66px) minmax(0,1fr) clamp(72px,13vw,132px);grid-template-rows:auto auto minmax(0,1fr);gap:clamp(4px,1.2dvh,8px);padding:clamp(5px,1.6dvh,11px);background:linear-gradient(145deg,#526b87,#26364b);border:2px solid var(--edge);border-radius:12px}
.screen{grid-column:1/3;display:grid;grid-template-columns:25px minmax(0,1fr);border:2px solid #142234;background:#101b29;border-radius:7px;min-width:0;overflow:hidden;height:calc(3 * var(--lh) + 6px);box-shadow:inset 0 1px 3px #0007}
.screen.active{border-color:#9acbff}.deck[data-mode=run] .screen.active{border-color:var(--run)}
.glyph{display:grid;place-items:center;background:#24364b;color:#9eb4cb;font:700 12px ui-monospace,monospace;border-right:1px solid #43566a;user-select:none}
.viewport{overflow:auto;min-width:0;min-height:0;scrollbar-width:thin;scrollbar-color:#6386a7 #101b29;overscroll-behavior:contain;touch-action:pan-x pan-y;user-select:text;-webkit-user-select:text;font:var(--font)/var(--lh) ui-monospace,SFMono-Regular,Consolas,monospace;color:#e5edf8}
pre{font:inherit;margin:0;padding:1px 5px;min-width:max-content;tab-size:4;white-space:pre}.line{height:var(--lh);display:block}.num{display:inline-block;width:3.2ch;color:#72869d;text-align:right;margin-right:1.2ch;user-select:none}.keyword{color:#d4afff}.string{color:#a5eab6}.number{color:#ffc58a}.comment{color:#7c96ab}.selected{background:#476b9c}.cursor{display:inline-block;width:0;height:.95em;vertical-align:-.12em;border-left:2px solid #9bd7ff;margin-right:-2px}.deck[data-mode=run] #output .cursor{border-color:var(--run)}
.console{grid-row:1}.editor{grid-row:2}.side{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:5px;min-height:0}.side button{flex:1;background:linear-gradient(#536e8c,#30465e);color:#e5efff;border-color:#7692af;font-size:clamp(14px,4.7dvh,25px)}
.keys{grid-column:2;grid-row:3;min-height:0;min-width:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(3px,1dvh,6px);background:#1a293b;padding:5px;border:1px solid #8298b1;border-radius:9px}
.keyrow{display:flex;gap:clamp(2px,.6vw,5px);min-height:0;min-width:0}.keyrow button{flex:var(--w,1) 1 0}.keyrow .aux{background:linear-gradient(#c5dfff,#9abce5)}.keyrow .fn{background:linear-gradient(#ded7fa,#b8b2e4)}.keyrow .enter{background:linear-gradient(#c4f6d0,#91d7a5)}.keyrow .space{flex:5 1 0}
.controls{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;min-height:0;gap:6px;padding:2px 0}
.switch{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:0 0 clamp(56px,20dvh,90px);background:#23364b;border:1px solid #7d94af;color:#e3edfa;border-radius:10px;font-size:clamp(10px,3dvh,15px);box-shadow:inset 0 1px 3px #0b1525}
.track{position:relative;width:75%;height:clamp(20px,7dvh,34px);border-radius:20px;background:#172739;border:2px solid #0c1622;box-shadow:inset 0 1px 5px #0009}.knob{position:absolute;top:2px;left:3px;height:calc(100% - 4px);aspect-ratio:1;border-radius:50%;background:#9acbff;box-shadow:0 1px 4px #0009;transition:left .12s,transform .12s}.deck[data-mode=run] .knob{left:calc(100% - 3px);transform:translateX(-100%);background:#9df2b1}.deck[data-mode=run] .track{background:#285f43}.modewords{display:flex;width:100%;justify-content:space-evenly;color:#8298ae}.deck[data-mode=edit] .modewords b:first-child,.deck[data-mode=run] .modewords b:last-child{color:#e6f4ff}
.clicks{display:flex;gap:4px;flex:0 0 clamp(24px,9dvh,42px)}.clicks button{flex:1;background:linear-gradient(#b3c7df,#849cb9);font-size:clamp(10px,3dvh,15px)}
.joywrap{flex:1;min-height:0;display:grid;place-items:center}.joy{width:100%;max-width:120px;max-height:100%;aspect-ratio:1;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:2px;background:#162334;border:2px solid #8ca2b9;border-radius:50%;padding:6%;overflow:hidden}.joy button{border-radius:7px;background:#3c526d;color:#dbe8f8;border:0;box-shadow:none;font-size:clamp(11px,4dvh,22px)}.joy .center{border-radius:50%;background:radial-gradient(circle at 35% 25%,#7c93ac,#30445c 65%,#1d2b3c);border:1px solid #9cb0c7}.joy .up{grid-area:1/2}.joy .left{grid-area:2/1}.joy .center{grid-area:2/2}.joy .right{grid-area:2/3}.joy .down{grid-area:3/2}
@media(orientation:portrait){.deck{grid-template-columns:32px minmax(0,1fr) 58px;grid-template-rows:auto auto minmax(0,1fr);--lh:18px;--font:12px}.keys{gap:4px;padding:3px}.keyrow{gap:2px}.keyrow button{font-size:11px}.joywrap{align-items:start}.switch{flex-basis:75px}}

/* beta 0.2 — physical-style controls */
.deck{position:relative;grid-template-columns:clamp(64px,11vw,105px) minmax(0,1fr) clamp(94px,15vw,155px)}
.side{position:relative;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:3px 0}
.side button{flex:none}
.dpad{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:min(100%,92px);aspect-ratio:1;gap:0;filter:drop-shadow(0 2px 1px #0d1725)}
.dpad button{height:100%;width:100%;border:0;border-radius:0;box-shadow:none;background:linear-gradient(#536c89,#2a4059);color:#dceafa;font-size:clamp(10px,3.1dvh,16px)}
.dpad .north{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .west{grid-area:2/1;border-radius:6px 0 0 6px}.dpad .south{grid-area:3/2;border-radius:0 0 6px 6px}.dpad .east{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .hub{grid-area:2/2;background:#3b526d}
.dpad button:active{background:#91bbeb;transform:none;color:#152436}
#flower{width:clamp(33px,8dvh,53px);aspect-ratio:1;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 25%,#7896b6,#304862 70%);font-size:clamp(19px,5dvh,29px);border:2px solid #9eb8d1;z-index:9;transition:transform .18s}
#flower[aria-expanded=true]{transform:rotate(45deg);background:#a0c5e9;color:#152436}
.flower-menu{position:absolute;left:50%;bottom:0;z-index:8;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .15s}
.flower-menu.open{opacity:1;pointer-events:auto}
.flower-menu button{position:absolute;width:clamp(38px,10dvh,54px);height:clamp(38px,10dvh,54px);border-radius:50%;font-size:clamp(9px,2.8dvh,13px);background:linear-gradient(#e3ebf8,#a3b9d3);color:#172438;box-shadow:0 3px 8px #071321b0;transform:translate(-50%,-50%) scale(.2);transition:transform .18s cubic-bezier(.2,.8,.2,1.15);white-space:nowrap}
.flower-menu.open button{transform:translate(-50%,-50%) scale(1)}
.flower-menu button[hidden]{display:none}
.menu-shade{position:absolute;inset:0;background:#06101d65;border:0;box-shadow:none;border-radius:10px;z-index:7;touch-action:manipulation}
.menu-shade[hidden]{display:none}
.side.menu-open{z-index:9}
.controls{gap:5px}
.clicks button{font-size:clamp(12px,3.7dvh,19px)}
.joywrap{grid-template-columns:minmax(0,1fr) clamp(18px,3.3vw,27px);gap:5px;align-items:center}
.joy{position:relative;display:block;width:100%;max-width:112px;max-height:none;aspect-ratio:1;padding:0;touch-action:none;user-select:none;overflow:visible;background:radial-gradient(circle,#253a51 0 47%,#142335 49% 70%,#46617d 71%);border:2px solid #8ca2b9;box-shadow:inset 0 3px 8px #0a1422}
.stick{position:absolute;left:50%;top:50%;width:53%;height:53%;border-radius:50%;background:radial-gradient(circle at 35% 22%,#9cb2ca,#475f7b 48%,#23364c 76%);border:1px solid #a4b7cb;box-shadow:0 4px 7px #09111fbb;transform:translate(-50%,-50%);pointer-events:none}
.wheel{height:clamp(58px,27dvh,112px);width:100%;border:2px solid #8299b3;border-radius:10px;background:#111f30;overflow:hidden;touch-action:none;cursor:ns-resize;box-shadow:inset 0 2px 5px #0008;position:relative}
.wheel-tread{position:absolute;inset:3px 2px;background:repeating-linear-gradient(to bottom,#8299b1 0px,#8299b1 2px,#30465f 3px,#30465f 8px);border-radius:6px;box-shadow:inset 4px 0 5px #0a162488,inset -4px 0 5px #0a162488;pointer-events:none}
.wheel:after{content:'';position:absolute;inset:0;background:linear-gradient(#101b2990,transparent 30%,transparent 70%,#101b2990);pointer-events:none}
.mouse-pointer{position:absolute;left:0;top:0;width:13px;height:19px;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px #000a);will-change:transform}
.mouse-pointer svg{display:block;width:100%;height:100%}.mouse-pointer path{fill:#fff;stroke:#162538;stroke-width:1.15;stroke-linejoin:round}
@media(orientation:portrait){.deck{grid-template-columns:48px minmax(0,1fr) 72px}.joywrap{grid-template-columns:minmax(0,1fr) 16px;gap:2px;align-items:center}.dpad{width:46px}.wheel{height:65px}.side{justify-content:flex-start;gap:20px}}

/* beta 0.3 — a dedicated scroll surface and single-step navigation */
.deck{grid-template-columns:clamp(48px,9vw,100px) minmax(0,1fr) clamp(70px,12vw,128px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.viewport{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.screen{grid-template-columns:25px minmax(0,1fr) clamp(19px,3vw,27px)}
.info-dot{border:0;border-left:1px solid #43566a;border-radius:0;background:#24364b;color:#a9c1db;font:italic 700 clamp(11px,3.2dvh,16px)/1 Georgia,serif;box-shadow:none;width:100%;height:100%}
.info-dot:active{transform:none;background:#405b76;color:#fff}
.side{justify-content:space-between;gap:6px}
.touchpad{width:100%;flex:1;min-height:0;border:2px solid #7f96b0;border-radius:11px;background:radial-gradient(circle at 1px 1px,#607a9240 1px,transparent 1.5px) 0 0/8px 8px,linear-gradient(#24384e,#172738);box-shadow:inset 0 2px 7px #07121d99;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid;place-items:center;cursor:grab}
.touchpad.dragging{border-color:#a0c8ec;cursor:grabbing;background-color:#304b66}
.touchpad svg{width:25px;max-width:48%;fill:none;stroke:#849eb7;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.65}
.direction-wrap{flex:1;min-height:0;display:grid;place-items:center}
.direction-wrap .dpad{width:min(100%,92px,30dvh);filter:none;gap:3px}
.direction-wrap .dpad button{background:linear-gradient(#657f9a,#354b63);border-radius:5px;border:1px solid #8097b1;font-size:clamp(12px,3.5dvh,19px);touch-action:manipulation;box-shadow:0 2px 0 #18283a}
.direction-wrap .dpad .hub{background:transparent}
.direction-wrap .dpad button:active{background:#9acbff;box-shadow:none;transform:translateY(1px)}
.mini-toast,.speed-panel{position:absolute;z-index:21;max-width:calc(100% - 16px);border:1px solid #829ebc;border-radius:8px;background:#132235e8;color:#e6f1fc;box-shadow:0 5px 16px #07132170;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font:clamp(10px,2.9dvh,13px)/1.35 ui-monospace,monospace;padding:7px 9px;overflow-wrap:anywhere}
.mini-toast{width:max-content;max-width:min(390px,65%);white-space:pre-wrap;pointer-events:none;animation:toastIn .12s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.speed-panel{left:8px;bottom:8px;width:min(270px,70%);background:#15273bf2}
.speed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.speed-head button{width:24px;height:24px}
#speedLevels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#speedLevels button{height:clamp(25px,8dvh,35px);font-size:12px}
#speedLevels button.on{background:#a2edb1}
#flower{font-variant-emoji:text}
@media(orientation:portrait){.deck{grid-template-columns:48px minmax(0,1fr) 64px}.side{justify-content:space-between;gap:6px}.direction-wrap .dpad{width:100%}}

/* beta 0.4 */
.deck[data-view=swap] .editor{grid-row:1}
.deck[data-view=swap] .console{grid-row:2}
.deck[data-view=focus]{grid-template-rows:auto 0 minmax(0,1fr);row-gap:clamp(4px,1.2dvh,8px)}
.deck[data-view=focus] .screen.active{grid-row:1/3;height:calc(6 * var(--lh) + 6px)}
.deck[data-view=focus] .screen:not(.active){display:none}
.pop-panel{width:min(340px,78%);max-height:calc(100% - 16px);display:flex;flex-direction:column;overflow:hidden}
.pop-panel[hidden]{display:none}
#viewLevels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#viewLevels button{height:clamp(32px,13dvh,50px);font-size:11px;white-space:pre-line}
#viewLevels button.on{background:#a2edb1}
#libraryList{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0;overscroll-behavior:contain;touch-action:pan-y}
#libraryList button{flex:none;min-height:30px;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:6px 9px;font:600 12px/1.2 ui-monospace,monospace}
#libraryList button small{font-size:10px;color:#48617b}
#libraryList button.restore{background:#b9e8cc}
#libraryList .lib-status{padding:6px;color:#b9cde0}
</style>
</head>
<body>
<main class="deck" id="deck" data-mode="edit">
<section class="screen console" id="consoleScreen" aria-label="Consola"><div class="glyph">&gt;_</div><div class="viewport" id="consoleView" tabindex="0"><pre id="output"></pre></div><button class="info-dot" id="consoleInfo" aria-label="Información de la consola" title="Información de la consola">i</button></section>
<section class="screen editor active" id="editorScreen" aria-label="Editor"><div class="glyph">.py</div><div class="viewport" id="editorView" tabindex="0"><pre id="code"></pre></div><button class="info-dot" id="editorInfo" aria-label="Información del script" title="Información del script">i</button></section>
<aside class="side" id="side" aria-label="Controles">
<div class="touchpad" id="touchpad" role="group" aria-label="Desplazamiento táctil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></div>
<button id="flower" aria-label="Menú" aria-expanded="false" aria-controls="flowerMenu">✳</button>
<div id="flowerMenu" class="flower-menu" role="group" aria-label="Menú radial" inert>
<button id="open" title="Abrir .py" aria-label="Abrir archivo">OPEN</button>
<button id="save" title="Guardar .py" aria-label="Guardar archivo">SAVE</button>
<button id="new" title="Nuevo script" aria-label="Nuevo script">NEW</button>
<button id="undo" title="Deshacer" aria-label="Deshacer">↶</button>
<button id="select" title="Seleccionar / interrumpir" aria-label="Seleccionar">SEL</button>
<button id="copy" title="Copiar / pegar" aria-label="Copiar o pegar">PST</button>
<button id="speed" title="Sensibilidad de scroll" aria-label="Sensibilidad de scroll">SPD</button>
<button id="view" title="Visualización" aria-label="Visualización">VIEW</button>
<button id="library" title="Biblioteca de scripts" aria-label="Biblioteca de scripts">LIB</button>
</div>
<input type="file" id="file" accept=".py,.txt,text/plain" hidden>
</aside>
<section class="keys" id="keyboard" aria-label="Teclado"></section>
<aside class="controls" aria-label="Controles">
<button class="switch" id="switch" role="switch" aria-checked="false" aria-label="EDIT / RUN"><span class="track"><span class="knob"></span></span><span class="modewords"><b>EDIT</b><b>RUN</b></span></button>
<div class="direction-wrap"><div class="dpad" id="dpad" aria-label="Cruceta">
<button class="north" data-move="up" aria-label="Arriba">▴</button><button class="west" data-move="left" aria-label="Izquierda">◂</button><span class="hub"></span><button class="east" data-move="right" aria-label="Derecha">▸</button><button class="south" data-move="down" aria-label="Abajo">▾</button>
</div></div>
</aside>
<button class="menu-shade" id="menuShade" aria-label="Cerrar menú" hidden></button>
<div class="mini-toast" id="miniToast" role="status" hidden></div>
<div class="speed-panel" id="speedPanel" role="group" aria-label="Sensibilidad de scroll" hidden><div class="speed-head"><span>Scroll</span><button id="speedClose" aria-label="Cerrar sensibilidad">×</button></div><div id="speedLevels"></div></div>
<div class="speed-panel pop-panel" id="viewPanel" role="group" aria-label="Visualización" hidden><div class="speed-head"><span>VIEW</span><button id="viewClose" aria-label="Cerrar">×</button></div><div id="viewLevels"></div></div>
<div class="speed-panel pop-panel" id="libraryPanel" role="group" aria-label="Biblioteca" hidden><div class="speed-head"><span>LIB</span><button id="libraryClose" aria-label="Cerrar">×</button></div><div id="libraryList"></div></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const deck=$('deck'), code=$('code'), out=$('output'), ev=$('editorView'), cv=$('consoleView');
let script='n = 5\nfor i in range(n):\n    print(i)', pos=0, anchor=null, undo=[], clip='', mode='edit', layer='abc', shift=false;
let runtimeMeta=null, runningFilename=null;
let filename='programa.py', transcript='', command='', cp=0, history=[], hi=0, worker=null, busy=false, waiting=false, loaded=false, channel=null, generation=0, pending=null;
try{const saved=JSON.parse(localStorage.getItem('duopy.beta.v1'));if(saved&&typeof saved.text==='string'){script=saved.text;filename=saved.name||filename;pos=Math.min(saved.pos||0,script.length)}}catch{}
let librarySource=null,draftBackup=null;
try{const s=JSON.parse(sessionStorage.getItem('duopy.library.scratch'));if(s&&typeof s.text==='string'&&s.source&&s.draft){draftBackup=s.draft;librarySource=s.source;script=s.text;filename=s.name;pos=Math.max(0,Math.min(s.pos||0,script.length))}}catch{}
function persist(){try{const state={text:script,name:filename,pos};if(librarySource){sessionStorage.setItem('duopy.library.scratch',JSON.stringify({...state,source:librarySource,draft:draftBackup}))}else{localStorage.setItem('duopy.beta.v1',JSON.stringify(state));sessionStorage.removeItem('duopy.library.scratch')}}catch{}}
function detachScratch(){if(!librarySource)return;const draft=draftBackup;librarySource=null;draftBackup=null;if(draft){script=draft.text;filename=draft.name;pos=draft.pos}anchor=null;undo=[];persist()}

function span(text,cls){const el=document.createElement('span');el.textContent=text;if(cls)el.className=cls;return el}
const tokens=/(#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|pass|break|continue|try|except|finally|raise|with|lambda|assert|True|False|None|yield|del|global|nonlocal)\b|\b\d+(?:\.\d+)?\b)/g;
function tokenClass(s){return s[0]==='#'?'comment':s[0]==='"'||s[0]==="'"?'string':/^\d/.test(s)?'number':'keyword'}
function renderEditor(follow=true){
 const frag=document.createDocumentFragment();let offset=0, caret=null;
 const lo=anchor===null?pos:Math.min(anchor,pos),hi=anchor===null?pos:Math.max(anchor,pos);
 script.split('\n').forEach((line,i)=>{
  const row=document.createElement('span');row.className='line';row.dataset.start=offset;row.dataset.length=line.length;row.append(span(String(i+1),'num'));
  const ranges=[...line.matchAll(tokens)].map(m=>[m.index,m.index+m[0].length,tokenClass(m[0])]);
  const cuts=new Set([0,line.length]);ranges.forEach(r=>{cuts.add(r[0]);cuts.add(r[1])});
  for(const v of [pos,lo,hi])if(v>=offset&&v<=offset+line.length)cuts.add(v-offset);
  const points=[...cuts].sort((a,b)=>a-b);
  for(let j=0;j<points.length;j++){const a=points[j],b=points[j+1];if(mode==='edit'&&offset+a===pos){caret=span('','cursor');row.append(caret)}if(b===undefined)break;const r=ranges.find(t=>a>=t[0]&&a<t[1]);const part=span(line.slice(a,b),(r?r[2]:'')+(offset+a>=lo&&offset+a<hi?' selected':''));part.dataset.offset=offset+a;row.append(part)}
  frag.append(row);offset+=line.length+1;
 });code.replaceChildren(frag);if(follow&&caret)caret.scrollIntoView({block:'nearest',inline:'nearest'});persist()
}
function renderConsole(follow=true){
 out.replaceChildren(document.createTextNode(transcript));
 if(mode==='run'&&(!busy||waiting)){const prompt=waiting?'':'>>> ';const before=span(command.slice(0,cp));before.dataset.command='0';const after=span(command.slice(cp));after.dataset.command=String(cp);out.append(document.createTextNode(prompt),before,span('','cursor'),after)}

function append(s){const follow=!transcript||cv.scrollHeight-cv.clientHeight-cv.scrollTop<5;transcript=(transcript+s).slice(-100000);renderConsole(follow)}

function enter(){if(mode==='edit'){const line=script.slice(script.lastIndexOf('\n',pos-1)+1,pos);replace('\n'+(line.match(/^\s*/)||[''])[0]+(line.trimEnd().endsWith(':')?'    ':''));return}

 if(waiting){const bytes=new TextEncoder().encode(text);if(bytes.length>channel.byteLength-8){command=text;cp=text.length;renderConsole();return}const state=new Int32Array(channel,0,2);new Uint8Array(channel,8).set(bytes);Atomics.store(state,1,bytes.length);waiting=false;append(text+'\n');Atomics.store(state,0,1);Atomics.notify(state,0);syncClicks();return}

}
function move(dir){if(mode==='run'){if(waiting||!busy){if(dir==='left')cp=Math.max(0,cp-1);if(dir==='right')cp=Math.min(command.length,cp+1);if(!waiting&&(dir==='up'||dir==='down')&&history.length){hi=Math.max(0,Math.min(history.length,hi+(dir==='up'?-1:1)));command=history[hi]||'';cp=command.length} else if(dir==='up'||dir==='down'){cv.scrollTop+=(dir==='up'?-1:1)*parseFloat(getComputedStyle(cv).lineHeight);return}renderConsole(false)}else cv.scrollTop+=(dir==='up'?-1:dir==='down'?1:0)*parseFloat(getComputedStyle(cv).lineHeight);return}

 if(dir==='left')pos=Math.max(0,pos-1);if(dir==='right')pos=Math.min(script.length,pos+1);

}
function syncClicks(){$('select').textContent=mode==='run'?'STOP':'SEL';$('select').setAttribute('aria-label',mode==='run'?'Interrumpir':'Seleccionar');$('select').classList.toggle('on',anchor!==null);$('copy').textContent=mode==='run'?'CLR':anchor!==null&&anchor!==pos?'CPY':'PST';$('copy').setAttribute('aria-label',mode==='run'?'Limpiar consola':anchor!==null&&anchor!==pos?'Copiar':'Pegar');$('undo').disabled=mode!=='edit';$('open').disabled=mode!=='edit';$('new').disabled=mode!=='edit'}
function selection(){if(mode==='run'){stop(true);return}anchor=anchor===null?pos:null;renderEditor();syncClicks()}
function copyPaste(){if(mode==='run'){transcript='';renderConsole();return}if(anchor!==null&&anchor!==pos){clip=script.slice(Math.min(anchor,pos),Math.max(anchor,pos));anchor=null;renderEditor();syncClicks();try{navigator.clipboard?.writeText(clip).catch(()=>{})}catch{}}

const key=(label,value=label,w=1,cls='')=>({label,value,w,cls});
function keyboard(){
 const letters=layer==='abc'?[...'qwertyuiop']:['+','-','*','/','//','%','**','=','==','!='];
 const mid=layer==='abc'?[...'asdfghjkl']:['<','>','<=','>=','&','|','^','~','@'];
 const low=layer==='abc'?[...'zxcvbnm']:['\\','!','?','#','$',';',':'];
 const chars=a=>a.map(c=>key(shift&&layer==='abc'?c.toUpperCase():c));
 const rows=[
  [...'1234567890'].map(x=>key(x)).concat(key('⌫','back',1.4,'fn')),
  ['(',')','[',']','{','}',':',',','.','_',"'",'"'].map(x=>key(x)),
  chars(letters).concat(key('TAB','tab',1.3,'aux')),
  chars(mid).concat(key('↵','enter',1.7,'enter')),
  [key('⇧','shift',1.2,'aux'),...chars(low),key(layer==='abc'?'SYM':'ABC','layer',1.5,'fn')],
  [key('def','def ',1,'fn'),key('if','if ',1,'fn'),key('for','for ',1,'fn'),key('',' ',4.3,'space'),key('=','=',1),key('+','+',1),key('-','-',1)]
 ];
 const fragment=document.createDocumentFragment();for(const row of rows){const r=document.createElement('div');r.className='keyrow';for(const k of row){const b=document.createElement('button');b.type='button';b.textContent=k.label;b.className=k.cls;b.style.setProperty('--w',k.w);b.dataset.key=k.value;b.setAttribute('aria-label',k.value===' '?'Espacio':k.label);if(k.value==='shift')b.classList.toggle('on',shift);r.append(b)}fragment.append(r)}$('keyboard').replaceChildren(fragment)

function action(k){if(k==='back')backspace();else if(k==='enter')enter();else if(k==='tab')insert('    ');else if(k==='shift'){shift=!shift;keyboard()}else if(k==='layer'){layer=layer==='abc'?'sym':'abc';shift=false;keyboard()}else if(k==='left'||k==='right')move(k);else{insert(k);if(shift&&layer==='abc'&&/^[A-Z]$/.test(k)){shift=false;keyboard()}}}
$('keyboard').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)action(b.dataset.key)});
// Each press moves exactly once; no hold-to-repeat.
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));$('select').onclick=selection;$('copy').onclick=copyPaste;
$('undo').onclick=()=>{if(mode==='edit'&&undo.length){[script,pos]=undo.pop();anchor=null;renderEditor();syncClicks()}};
$('new').onclick=()=>{if(mode==='edit'&&(!script||confirm('¿Nuevo script?'))){detachScratch();snapshot();script='';pos=0;anchor=null;filename='programa.py';renderEditor();syncClicks()}};
$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(f&&mode==='edit'){try{const s=await f.text();if(mode!=='edit')return;detachScratch();snapshot();script=s;filename=f.name;pos=0;anchor=null;renderEditor();syncClicks()}catch(e){append(String(e)+'\n')}}$('file').value=''};
$('save').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([script],{type:'text/x-python'}));a.href=url;a.download=filename.endsWith('.py')?filename:filename+'.py';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function startWorker(){if(worker)return;const id=++generation;loaded=false;runtimeMeta=null;channel=typeof SharedArrayBuffer==='function'&&crossOriginIsolated?new SharedArrayBuffer(65544):null;

  if(m.type==='ready'){loaded=true;if(pending){const p=pending;pending=null;worker.postMessage(p)}}
  else if(m.type==='meta'){runtimeMeta=m.meta;if(!toast.hidden&&toastKind==='runtime')showToast(runtimeInfo(),$('consoleInfo'),4200,'runtime')}
  else if(m.type==='out')append(m.text);
  else if(m.type==='input'){waiting=true;command='';cp=0;renderConsole();syncClicks()}
  else if(m.type==='done'){busy=false;waiting=false;renderConsole();syncClicks()}
  else if(m.type==='fatal'){append(m.text+'\n');stop(false)}
 };worker.onerror=e=>{if(id===generation){append('Error: '+e.message+'\n');stop(false)}};worker.postMessage({type:'init',channel})
}
function execute(kind,text){if(busy)return;busy=true;waiting=false;command='';cp=0;renderConsole();try{startWorker();if(kind==='script')runningFilename=filename;const p={type:kind,code:text,filename:runningFilename||filename};if(loaded)worker.postMessage(p);else{pending=p;append('… Python\n')}}catch(e){append(String(e)+'\n');stop(false)}}
function stop(note){if(worker){worker.terminate();worker=null;generation++}if(note&&busy)append('\nKeyboardInterrupt\n');busy=false;waiting=false;loaded=false;runtimeMeta=null;pending=null;channel=null;command='';cp=0;renderConsole();syncClicks()}
function toggle(){if(mode==='edit'){mode='run';anchor=null;transcript='';deck.dataset.mode=mode;execute('script',script)}else{if(busy)stop(true);mode='edit';deck.dataset.mode=mode} $('switch').setAttribute('aria-checked',String(mode==='run'));$('consoleScreen').classList.toggle('active',mode==='run');$('editorScreen').classList.toggle('active',mode==='edit');renderEditor();renderConsole();syncClicks()}
$('switch').onclick=()=>{closeMenu();closePanels();cancelPad();hideToast();toggle();if(deck.dataset.view==='focus')requestAnimationFrame(()=>{if(mode==='edit')renderEditor();else renderConsole()})};
document.addEventListener('keydown',e=>{if(e.isComposing||e.target.tagName==='INPUT')return;if(e.key==='Escape'){if(menuOpen||!viewPanel.hidden||!libraryPanel.hidden||!speedPanel.hidden){e.preventDefault();closeMenu();closePanels();return}}if(e.key==='F5'){e.preventDefault();$('switch').click();return}if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'&&mode==='edit'){e.preventDefault();$('undo').click()}else if(e.key.toLowerCase()==='c'&&mode==='run'&&busy){e.preventDefault();stop(true)}return}

// Touchpad: direct 2-axis scrolling with adjustable gain, no caret movement.
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function activeView(){return mode==='edit'?ev:cv}
const pad=$('touchpad'),levels=[.4,.7,1,1.4,2,3];
let sensitivity=.4;try{const n=Number(localStorage.getItem('duopy.scroll.sensitivity'));if(levels.includes(n))sensitivity=n}catch{}
let padId=null,padView=null,lastX=0,lastY=0,targetX=0,targetY=0;
function cancelPad(){const id=padId;padId=null;padView=null;pad.classList.remove('dragging');if(id!==null&&pad.hasPointerCapture(id))pad.releasePointerCapture(id)}
pad.addEventListener('pointerdown',e=>{if(padId!==null||e.button!==0)return;e.preventDefault();padId=e.pointerId;padView=activeView();lastX=e.clientX;lastY=e.clientY;targetX=padView.scrollLeft;targetY=padView.scrollTop;pad.setPointerCapture(padId);pad.classList.add('dragging')});

['pointerup','pointercancel','lostpointercapture'].forEach(n=>pad.addEventListener(n,e=>{if(e.pointerId===padId)cancelPad()}));

deck.addEventListener('contextmenu',e=>{if(!e.target.closest('.viewport'))e.preventDefault()});
deck.addEventListener('selectstart',e=>{if(!e.target.closest('.viewport'))e.preventDefault()});
const toast=$('miniToast');let toastTimer=null,toastKind=null;
function hideToast(){clearTimeout(toastTimer);toast.hidden=true;toastKind=null}
function showToast(message,button,duration=3000,kind=null){clearTimeout(toastTimer);toast.textContent=message;toastKind=kind;toast.hidden=false;const d=deck.getBoundingClientRect(),r=button.getBoundingClientRect();toast.style.left=clamp(r.right-d.left-deck.clientLeft-toast.offsetWidth,6,deck.clientWidth-toast.offsetWidth-6)+'px';toast.style.top=clamp(r.bottom-d.top-deck.clientTop+5,6,deck.clientHeight-toast.offsetHeight-6)+'px';toastTimer=setTimeout(hideToast,duration)}
function runtimeInfo(){const m=runtimeMeta;return 'Python · navegador (Pyodide)\n'+(m?'Python '+m.version+' · '+m.cwd+(busy?' (último estado)':''):'Intérprete '+(busy?'cargando…':'sin iniciar'))+'\n'+(runningFilename?'Script: '+runningFilename+'\n':'')+(m?'Módulos base (ej.): '+m.modules.join(', '):'Módulos base: math, random, collections…')+(m&&m.packages.length?'\nPaquetes cargados: '+m.packages.join(', '):'')+'\nOtros paquetes compatibles: bajo demanda'}
$('consoleInfo').onclick=()=>showToast(runtimeInfo(),$('consoleInfo'),4200,'runtime');
$('editorInfo').onclick=()=>showToast(filename+(librarySource?'\nCopia temporal · LIB':''),$('editorInfo'),2300,'file');
const speedPanel=$('speedPanel');
function closeSpeed(){speedPanel.hidden=true}
function openSpeed(){closePanels();hideToast();const box=$('speedLevels');box.replaceChildren(...levels.map(n=>{const b=document.createElement('button');b.textContent=n+'×';b.classList.toggle('on',n===sensitivity);b.setAttribute('aria-pressed',String(n===sensitivity));b.onclick=()=>{sensitivity=n;try{localStorage.setItem('duopy.scroll.sensitivity',String(n))}catch{}closeSpeed();showToast('Scroll '+n+'×',$('flower'),1800)};return b}));speedPanel.hidden=false}
$('speedClose').onclick=closeSpeed;

const viewPanel=$('viewPanel'),libraryPanel=$('libraryPanel'),libList=$('libraryList');
let libRequest=0,libraryManifest=null;

function status(s){const el=document.createElement('div');el.className='lib-status';el.textContent=s;return el}

async function loadLibrary(item){if(mode!=='edit')return;if(librarySource&&!confirm('¿Reemplazar la copia temporal actual?'))return;const request=++libRequest;libList.replaceChildren(status('…'));try{const r=await fetch('./scripts/'+encodeURIComponent(item.file),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();if(request!==libRequest||mode!=='edit')return;if(!librarySource){draftBackup={text:script,name:filename,pos};persist()}librarySource=item.file;filename=item.file;script=text;pos=0;anchor=null;undo=[];persist();closePanels();renderEditor();syncClicks();showToast(filename+' · copia',$('flower'),1800)}catch(e){if(request===libRequest)libList.replaceChildren(status(String(e)),...libraryButtons(libraryManifest||[]))}}

async function openLibrary(){if(mode!=='edit'){showToast('LIB · EDIT',$('flower'),1800);return}closePanels();hideToast();libraryPanel.hidden=false;const request=++libRequest;libList.replaceChildren(status('…'));try{const r=await fetch('./scripts/index.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const manifest=await r.json();if(request!==libRequest)return;if(!Array.isArray(manifest))throw Error('Biblioteca inválida');libraryManifest=manifest.filter(s=>s&&typeof s.title==='string'&&typeof s.file==='string'&&/^[a-zA-Z0-9_-]+\.py$/.test(s.file));const nodes=libraryButtons(libraryManifest);libList.replaceChildren(...(nodes.length?nodes:[status('Vacío')]))}catch(e){if(request===libRequest)libList.replaceChildren(status('LIB · '+e.message),...libraryButtons([]))}}

const menu=$('flowerMenu'), flower=$('flower'), shade=$('menuShade');let menuOpen=false;
function layoutMenu(){const bounds=deck.getBoundingClientRect(),base=flower.getBoundingClientRect(),mb=menu.getBoundingClientRect();const cx=base.left+base.width/2,cy=base.top+base.height/2;const buttons=[...menu.querySelectorAll('button')].filter(b=>!b.hidden);const size=buttons[0]?.offsetWidth||42;
 const outer=buttons.length>7?5:4;const rings=buttons.length>4?[buttons.slice(0,outer),buttons.slice(outer)]:[buttons];

flower.onclick=()=>menuOpen?closeMenu():openMenu();shade.onclick=closeMenu;menu.addEventListener('click',e=>{if(e.target.closest('button'))closeMenu()});
window.addEventListener('resize',()=>{cancelPad();hideToast();if(menuOpen)layoutMenu()});
keyboard();renderEditor();renderConsole();syncClicks();

  const reload=()=>{try{if(sessionStorage.getItem('duopy-coi-reload'))return;sessionStorage.setItem('duopy-coi-reload','1')}catch{return}if(!busy)location.reload()};
  if(navigator.serviceWorker.controller)reload();else navigator.serviceWorker.addEventListener('controllerchange',reload,{once:true});
